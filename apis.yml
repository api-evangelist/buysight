name: Buysight
description: 'Buysight, Inc. was a Silicon Valley advertising technology startup founded
  in 2008 that built intent-based audience targeting, retargeting, and Dynamic Creative
  Optimization (DCO) for display advertising, using machine learning to select both
  the audience for an impression and the creative shown to that user. The company raised
  approximately $16 million from ONSET Ventures, Rembrandt Venture Partners, Uncork
  Capital (SoftTech VC / Jeff Clavier), Reid Hoffman, and AOL. On December 4, 2012
  Buysight was acquired by AOL''s Advertising.com Group, with the entire team joining
  AOL and the DCO and machine-learning technology folded into AOL''s AdLearn optimization
  engine alongside Advertising.com, ADTECH, the AOL On Network, goviral, and Pictela.
  Buysight no longer operates as an independent company and publishes no developer
  program, API, documentation, or SDKs. The buysight.com domain is held by MarkMonitor
  and redirects to a registrar placeholder page. This profile is retained as a historical
  acquisition record in the API Evangelist network.'
